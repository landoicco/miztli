plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'

    id 'com.gradleup.shadow' version '8.3.0'
}

bootJar {
    enabled = false
}

jar {
    enabled = false
}

dependencies {
    implementation project(':app')
    implementation project(':domain')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.cloud:spring-cloud-function-adapter-aws:4.1.3'
    implementation 'org.springframework.cloud:spring-cloud-function-context'
    implementation 'software.amazon.awssdk:dynamodb:2.25.0'
    implementation 'software.amazon.awssdk:dynamodb-enhanced:2.20.0'
    implementation 'software.amazon.awssdk:s3:2.20.0'
}


shadowJar {
    archiveFileName = 'miztli-lambda.jar'
    archiveClassifier = 'aws'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Place final JAR on root
    destinationDirectory = layout.projectDirectory.dir("../../")

    mergeServiceFiles()

    append 'META-INF/spring.handlers'
    append 'META-INF/spring.schemas'
    append 'META-INF/spring.tooling'
    append 'META-INF/spring.factories'
    append 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
    append 'META-INF/spring/org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration.imports'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Always build fat jar on each build
build.dependsOn shadowJar
