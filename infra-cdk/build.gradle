plugins {
    id 'java'
    id 'application' // Necesario para que CDK ejecute la App

    id "com.diffplug.spotless" version "6.25.0"
}

group = 'licaza.miztli.cloud.infrastructure'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // El núcleo de AWS CDK v2
    implementation 'software.amazon.awscdk:aws-cdk-lib:2.110.0'
    implementation 'software.constructs:constructs:10.3.0'

    // Módulos Alpha para API Gateway moderno (más fácil de usar)
    implementation 'software.amazon.awscdk:apigatewayv2-alpha:2.110.0-alpha.0'
    implementation 'software.amazon.awscdk:apigatewayv2-integrations-alpha:2.110.0-alpha.0'
}

subprojects {
    apply plugin: "com.diffplug.spotless"
    spotless {
        java {
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

application {
    // Clase principal que arranca el despliegue
    mainClass = 'licaza.miztli.cloud.CdkApp'
}
