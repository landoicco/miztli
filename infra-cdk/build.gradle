plugins {
    id 'java'
    id 'application'

    id "com.diffplug.spotless" version "6.25.0"
}

group = 'licaza.miztli.cloud'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awscdk:aws-cdk-lib:2.110.0'
    implementation 'software.constructs:constructs:10.3.0'
}

subprojects {
    apply plugin: "com.diffplug.spotless"
    spotless {
        java {
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

application {
    mainClass = 'licaza.miztli.cloud.CdkApp'
}
